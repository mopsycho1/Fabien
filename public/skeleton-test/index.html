<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gaha skeleton test</title>
<style>
  :root { --bg: #24180f; --panel: #3a2a1e; --ink: #f4e8d6; --muted: #cdb69a; --gold: #e2b25c; --line: #6e5238; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 22px; margin: 4px 0 4px; }
  .sub { color: var(--muted); font-size: 14px; line-height: 1.45; margin: 0 0 12px; }
  /* side by side even on a phone, so both play at once (about the size units are in battle) */
  .stage { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  figure { margin: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 6px; }
  canvas { width: 100%; height: auto; display: block; border-radius: 8px; }
  figcaption { font-size: 12px; color: var(--muted); text-align: center; margin-top: 6px; line-height: 1.35; }
  figcaption b { color: var(--ink); }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 6px; }
  .controls.views button { font-size: 14px; }
  button { font: inherit; font-size: 15px; padding: 10px 14px; min-height: 44px; border-radius: 10px;
           border: 1px solid #8a6a46; background: #4b3423; color: var(--ink); cursor: pointer; }
  button.on { background: var(--gold); color: #24180f; border-color: var(--gold); }
  .notes { font-size: 15px; line-height: 1.55; }
  .notes h2 { font-size: 17px; margin: 18px 0 6px; color: var(--gold); }
  .notes h3 { font-size: 15px; margin: 14px 0 4px; }
  .notes ul { padding-left: 20px; margin: 4px 0; }
  .notes li { margin: 4px 0; }
  a { color: var(--gold); }
</style>
</head>
<body>
<main>
  <h1>Gaha skeleton test</h1>
  <p class="sub">Left: Gaha put together in code from Suleiman's parts sheets and moved by a skeleton.
    Right: the same thrust drawn frame by frame ("Test for Gaha's sprite with skeleton").</p>

  <div class="controls views">
    <button id="v_dr" data-rig="dr">Down-right</button>
    <button id="v_ur" data-rig="ur">Up-right</button>
    <button id="v_r1" data-rig="r1">Round 1 (front)</button>
    <button id="mirror">Face left</button>
  </div>
  <div class="controls">
    <button id="idle" class="on">Idle</button>
    <button id="thrust">Thrust</button>
    <button id="slow">Slow motion</button>
    <button id="bones">Show bones</button>
  </div>

  <div class="stage">
    <figure>
      <canvas id="rig" width="600" height="560"></canvas>
      <figcaption id="rigCap"><b>Skeleton</b></figcaption>
    </figure>
    <figure>
      <canvas id="frames" width="600" height="560"></canvas>
      <figcaption><b>Frame by frame</b><br>6 drawn pictures per direction (no idle frames on the sheet)</figcaption>
    </figure>
  </div>

  <div class="notes" id="notes"></div>
</main>

<script>
// ---------------------------------------------------------------------------
// The skeleton test. Plain canvas, no game engine, so it is easy to read.
//
// Each rig (rig.json, rig_dr.json, rig_ur.json) lists its bones. Each bone has:
//   part   the picture it shows (<parts folder>/<part>.png)
//   parent the bone it hangs from (null for the hips, the root)
//   pivot  the joint inside its own picture (where it turns)
//   tip    the far joint; the picture is turned so pivot -> tip points straight down
//   at     where its pivot sits inside the PARENT's picture
//   angle  its resting turn in degrees (clockwise), flip, scale, z (drawing order)
// A pose adds to that: { boneName: { angle, move: [x, y], sy, alt, world } }.
//   alt   1 = draw the bone's other picture ("alts": the chest and head turned further)
//   world an angle for the bone on the screen, instead of a change from its rest
//   flip  1 = the picture turned over across its long axis (the spear's tassels)
// The rig file also holds its moves ("thrust" keys), which bones sway ("sway"),
// and which limbs reach for things ("ik": feet stay planted, a hand finds the shaft).
// ---------------------------------------------------------------------------

// 2D matrices as [a, b, c, d, e, f] meaning x' = a*x + b*y + c, y' = d*x + e*y + f
const mul = (m, n) => [
  m[0] * n[0] + m[1] * n[3], m[0] * n[1] + m[1] * n[4], m[0] * n[2] + m[1] * n[5] + m[2],
  m[3] * n[0] + m[4] * n[3], m[3] * n[1] + m[4] * n[4], m[3] * n[2] + m[4] * n[5] + m[5]];
const T = (x, y) => [1, 0, x, 0, 1, y];
const R = (deg) => { const r = deg * Math.PI / 180, c = Math.cos(r), s = Math.sin(r); return [c, -s, 0, s, c, 0]; };
const S = (sx, sy) => [sx, 0, 0, 0, sy, 0];
const apply = (m, p) => [m[0] * p[0] + m[1] * p[1] + m[2], m[3] * p[0] + m[4] * p[1] + m[5]];
const DEG = 180 / Math.PI;

function loadImage(src) {
  return new Promise((ok, fail) => { const im = new Image(); im.onload = () => ok(im); im.onerror = fail; im.src = src; });
}

// How a bone's picture sits in the bone's own frame (pivot at 0,0, bone pointing down).
// flipY mirrors the picture across its own long axis (the spear turned over,
// so its tassels hang down whichever way it points).
function partMatrix(b, sx = 1, sy = 1, flipY = false) {
  const fx = b.flip ? -1 : 1, fy = flipY ? -1 : 1;
  let c = 0;
  if (b.tip) c = Math.atan2((b.tip[0] - b.pivot[0]) * fx, (b.tip[1] - b.pivot[1]) * fy) * DEG;
  const sc = b.scale || 1;
  return mul(S(sc * sx, sc * sy), mul(R(c), mul(S(fx, fy), T(-b.pivot[0], -b.pivot[1]))));
}
// How long a bone is (pivot to tip), after its scale
const boneLength = (b) => Math.hypot(b.tip[0] - b.pivot[0], b.tip[1] - b.pivot[1]) * (b.scale || 1);

// Two-bone reach (legs, and a hand reaching for the shaft). Angles are
// "straight down turned clockwise by this much", in radians.
function solveTwo(H, F, L1, L2, bend) {
  const dx = F[0] - H[0], dy = F[1] - H[1];
  const d = Math.min(Math.max(Math.hypot(dx, dy), Math.abs(L1 - L2) + 1), L1 + L2 - 0.5);
  const base = Math.atan2(-dx, dy);
  const a = Math.acos(Math.max(-1, Math.min(1, (L1 * L1 + d * d - L2 * L2) / (2 * L1 * d))));
  const first = base + bend * a;
  const K = [H[0] - Math.sin(first) * L1, H[1] + Math.cos(first) * L1];
  return [first, Math.atan2(-(F[0] - K[0]), F[1] - K[1])];
}

// ---------- One rig ----------
// Works out where every bone is for a pose. Returns { draw, frame, angle }.
function solve(rig, pose, useIk = true) {
  const { bones } = rig;
  const W = {}, A = {}, P = {};
  for (const b of rig.data.bones) { const p = pose[b.name] || {}; P[b.name] = partMatrix(b, p.sx || 1, p.sy || 1, (p.flip || 0) >= 0.5); }
  const local = {};
  const get = (n) => {
    if (W[n]) return W[n];
    const b = bones[n], p = pose[n] || {};
    const ang = n in local ? local[n] : (b.angle || 0) + (p.angle || 0);
    const mv = p.move || [0, 0];
    let m;
    if (b.parent) {
      const at = apply(P[b.parent], b.at);
      m = mul(get(b.parent), T(at[0] + mv[0], at[1] + mv[1]));
      A[n] = A[b.parent] + ang;
    } else {
      m = T(rig.data.origin[0] + mv[0], rig.data.origin[1] + mv[1]);
      A[n] = ang;
    }
    W[n] = mul(m, R(ang));
    return W[n];
  };
  const ik = rig.data.ik || {};
  // the feet stay where they were (a stepping foot moves by its pose "move")
  if (useIk && rig.restFeet) {
    for (const leg of ik.legs || []) {
      const tb = bones[leg.thigh], sb = bones[leg.shin];
      get(tb.parent);
      const H = apply(mul(W[tb.parent], T(...apply(P[tb.parent], tb.at))), [0, 0]);
      const off = (pose[leg.foot] && pose[leg.foot].move) || [0, 0];
      const F = [rig.restFeet[leg.foot][0] + off[0], rig.restFeet[leg.foot][1] + off[1]];
      const [th, sh] = solveTwo(H, F, boneLength(tb), boneLength(sb), rig.bend[leg.foot]);
      local[leg.thigh] = th * DEG - A[tb.parent];
      local[leg.shin] = (sh - th) * DEG;
    }
  }
  // two hands on the spear: the free hand reaches for a point on the shaft
  const g = ik.grip;
  const w = g && pose.grip ? pose.grip.w || 0 : 0;
  if (g && w > 0) {
    get(g.spear);
    const up = bones[g.upper], fo = bones[g.fore], ha = bones[g.hand];
    get(up.parent);
    const shaft = apply(mul(W[g.spear], P[g.spear]), g.point);
    const handAngle = A[g.spear] - 180; // the hand lies along the shaft, toward the point
    const hr = handAngle / DEG;
    const wrist = [shaft[0] + Math.sin(hr) * g.reach, shaft[1] - Math.cos(hr) * g.reach];
    const S0 = apply(mul(W[up.parent], T(...apply(P[up.parent], up.at))), [0, 0]);
    const [ua, fa] = solveTwo(S0, wrist, boneLength(up), boneLength(fo), g.bend || 1);
    const fk = (bn) => (bones[bn].angle || 0) + ((pose[bn] || {}).angle || 0);
    const ikU = ua * DEG - A[up.parent], ikF = (fa - ua) * DEG, ikH = handAngle - fa * DEG;
    local[g.upper] = fk(g.upper) + (ikU - fk(g.upper)) * w;
    local[g.fore] = fk(g.fore) + (ikF - fk(g.fore)) * w;
    local[g.hand] = fk(g.hand) + (ikH - fk(g.hand)) * w;
  }
  for (const b of rig.data.bones) get(b.name);
  const draw = {};
  for (const b of rig.data.bones) {
    const alt = rig.data.alts && rig.data.alts[b.name];
    if (alt && pose[b.name] && (pose[b.name].alt || 0) >= 0.5) {
      // the turned picture, with its own joint on the same spot
      const p = pose[b.name];
      draw[b.name] = { m: mul(W[b.name], partMatrix({ ...b, part: alt.part, pivot: alt.pivot, tip: null }, p.sx || 1, p.sy || 1)), img: rig.images[alt.part] };
    } else draw[b.name] = { m: mul(W[b.name], P[b.name]), img: rig.images[b.part] };
  }
  return { draw, frame: W, angle: A };
}

async function loadRig(file) {
  const data = await (await fetch(file)).json();
  const rig = { data, bones: Object.fromEntries(data.bones.map((b) => [b.name, b])), images: {} };
  rig.order = [...data.bones].sort((a, b) => (a.z || 0) - (b.z || 0));
  const names = new Set(data.bones.map((b) => b.part));
  for (const a of Object.values(data.alts || {})) names.add(a.part);
  await Promise.all([...names].map((n) => loadImage(data.parts + n + '.png').then((im) => { rig.images[n] = im; })));
  const frames = await (await fetch('frames/' + data.frames + '.json')).json();
  rig.frames = frames;
  rig.frameImgs = await Promise.all(frames.map((f, i) => loadImage('frames/' + data.frames + '_' + i + '.png')));
  // where the feet are at rest, and which way each knee bends
  const rest = solve(rig, {}, false);
  rig.restFeet = {}; rig.bend = {};
  for (const leg of (data.ik && data.ik.legs) || []) {
    const sb = rig.bones[leg.shin];
    rig.restFeet[leg.foot] = apply(rest.frame[leg.shin], [0, boneLength(sb)]);
    const H = apply(rest.frame[leg.thigh], [0, 0]), F = rig.restFeet[leg.foot];
    const line = Math.atan2(-(F[0] - H[0]), F[1] - H[1]) * DEG;
    rig.bend[leg.foot] = (rest.angle[leg.thigh] - line) >= 0 ? 1 : -1;
  }
  // the thrust keys: "same" repeats the key before; "world" angles become changes from rest
  const keys = data.thrust.keys.map((k) => ({ ...k }));
  keys.forEach((k, i) => { if (k.pose === 'same') k.pose = keys[i - 1].pose; });
  const topo = [];
  const seen = new Set();
  const visit = (b) => { if (seen.has(b.name)) return; if (b.parent) visit(rig.bones[b.parent]); seen.add(b.name); topo.push(b); };
  data.bones.forEach(visit);
  for (const k of keys) {
    const A = {};
    const pose = JSON.parse(JSON.stringify(k.pose));
    for (const b of topo) {
      const p = pose[b.name];
      const parentA = b.parent ? A[b.parent] : 0;
      if (p && p.world !== undefined) { p.angle = p.world - parentA - (b.angle || 0); delete p.world; }
      A[b.name] = parentA + (b.angle || 0) + ((p && p.angle) || 0);
    }
    k.pose = pose;
  }
  rig.keys = keys;
  rig.length = data.thrust.length;
  rig.frameTimes = data.thrust.frameTimes;
  return rig;
}

// ---- The moves --------------------------------------------------------------
// Idle: slow breathing. The chest swells, the head and arms follow a beat later.
const IDLE_PERIOD = 2.8;
function idlePose(rig, t) {
  const c = rig.data.idle;
  const s = Math.sin(t / IDLE_PERIOD * Math.PI * 2);
  const s2 = Math.sin((t / IDLE_PERIOD - 0.15) * Math.PI * 2);
  const pose = {};
  pose[c.root] = { move: [0, 2 * s] };
  pose[c.chest] = { sy: 1 + 0.012 * s, angle: 0.6 * s2 };
  pose[c.head] = { angle: -0.8 * s2, move: [0, -1 * s] };
  pose[c.arms[0]] = { angle: -1.2 * s2 }; pose[c.arms[1]] = { angle: 1.2 * s2 };
  pose[c.fores[0]] = { angle: 1 * s2 }; pose[c.fores[1]] = { angle: -1.5 * s2 };
  pose[c.spear] = { angle: 0.8 * s2 };
  if (c.mantle) pose[c.mantle] = { move: [0, -1.5 * s] };
  if (c.cape) pose[c.cape] = { angle: 1.2 * s2 };
  return pose;
}

const EASE = {
  in: (u) => u * u, out: (u) => 1 - (1 - u) * (1 - u),
  inout: (u) => (u < 0.5 ? 2 * u * u : 1 - 2 * (1 - u) * (1 - u)), linear: (u) => u,
};
function blend(a, b, u) {
  const out = {};
  for (const n of new Set([...Object.keys(a), ...Object.keys(b)])) {
    const pa = a[n] || {}, pb = b[n] || {};
    const ma = pa.move || [0, 0], mb = pb.move || [0, 0];
    out[n] = {
      angle: (pa.angle || 0) + ((pb.angle || 0) - (pa.angle || 0)) * u,
      move: [ma[0] + (mb[0] - ma[0]) * u, ma[1] + (mb[1] - ma[1]) * u],
      sy: (pa.sy || 1) + ((pb.sy || 1) - (pa.sy || 1)) * u,
      w: (pa.w || 0) + ((pb.w || 0) - (pa.w || 0)) * u,
      alt: (pa.alt || 0) + ((pb.alt || 0) - (pa.alt || 0)) * u,
      flip: (pa.flip || 0) + ((pb.flip || 0) - (pa.flip || 0)) * u,
    };
  }
  return out;
}
function keyedPose(keys, t) {
  if (t <= keys[0].t) return keys[0].pose;
  for (let i = 1; i < keys.length; i++) {
    if (t <= keys[i].t) {
      const k0 = keys[i - 1], k1 = keys[i];
      return blend(k0.pose, k1.pose, EASE[k1.ease || 'inout']((t - k0.t) / (k1.t - k0.t)));
    }
  }
  return keys[keys.length - 1].pose;
}
// Adds poses together (the idle keeps breathing under the thrust, the strips sway on top)
function addPose(a, b) {
  const out = {};
  for (const n of new Set([...Object.keys(a), ...Object.keys(b)])) {
    const pa = a[n] || {}, pb = b[n] || {};
    const ma = pa.move || [0, 0], mb = pb.move || [0, 0];
    out[n] = { angle: (pa.angle || 0) + (pb.angle || 0), move: [ma[0] + mb[0], ma[1] + mb[1]], sy: (pa.sy || 1) * (pb.sy || 1), w: (pa.w || 0) + (pb.w || 0), alt: (pa.alt || 0) + (pb.alt || 0), flip: (pa.flip || 0) + (pb.flip || 0) };
  }
  return out;
}

// ---- Swaying strips (cape, skirt, mantle) -------------------------------------
// Each strip is a little spring: when the body moves sideways it swings the
// other way, overshoots and settles; at rest it stirs a little on its own.
function swayStep(rig, state, pose, dt, t) {
  const sway = rig.data.sway || {};
  const root = rig.data.idle.root;
  const x = ((pose[root] && pose[root].move) || [0, 0])[0];
  const vx = state.lastX === undefined ? 0 : (x - state.lastX) / dt;
  state.lastX = x;
  let i = 0;
  for (const [n, k] of Object.entries(sway)) {
    const s = state[n] || (state[n] = { a: 0, v: 0 });
    const target = Math.max(-28, Math.min(28, -vx * 0.09 * k)) + Math.sin(t * 1.7 + i * 1.3) * 1.6 * k;
    s.v += (60 * (target - s.a) - 7 * s.v) * dt;
    s.a += s.v * dt;
    i++;
  }
}
function swayPose(rig, state) {
  const out = {};
  for (const n of Object.keys(rig.data.sway || {})) if (state[n]) out[n] = { angle: state[n].a };
  return out;
}

// ---- Drawing ----------------------------------------------------------------
const rigCanvas = document.getElementById('rig');
const frameCanvas = document.getElementById('frames');
const FRAME_VIEW = [-34, 0, 260, 243];
const BG = '#4a3526';

function fit(canvas, view) {
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const w = Math.round(canvas.clientWidth * dpr);
  const h = Math.round(w * view[3] / view[2]);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  return w / view[2];
}
// the base transform for a panel: world -> canvas pixels (mirrored when facing left)
function baseFor(k, view, flip) {
  return flip ? [-k, 0, (view[0] + view[2]) * k, 0, k, -view[1] * k] : [k, 0, -view[0] * k, 0, k, -view[1] * k];
}

function drawRig(rig, pose) {
  const view = rig.data.view;
  const ctx = rigCanvas.getContext('2d');
  const k = fit(rigCanvas, view);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = BG; ctx.fillRect(0, 0, rigCanvas.width, rigCanvas.height);
  const r = solve(rig, pose);
  const base = baseFor(k, view, mirror);
  // a soft shadow under the feet
  const feet = Object.values(rig.restFeet);
  if (feet.length) {
    const xs = feet.map((f) => f[0]), y = Math.max(...feet.map((f) => f[1]));
    ctx.setTransform(base[0], base[3], base[1], base[4], base[2], base[5]);
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath(); ctx.ellipse((Math.min(...xs) + Math.max(...xs)) / 2, y + 6, (Math.max(...xs) - Math.min(...xs)) / 2 + 70, 14, 0, 0, Math.PI * 2); ctx.fill();
  }
  for (const b of rig.order) {
    const d = r.draw[b.name];
    const m = mul(base, d.m);
    ctx.setTransform(m[0], m[3], m[1], m[4], m[2], m[5]);
    ctx.drawImage(d.img, 0, 0);
  }
  if (showBones) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.lineWidth = Math.max(2, 4 * k); ctx.strokeStyle = '#57e3ff'; ctx.fillStyle = '#57e3ff';
    const pt = (n, p = [0, 0]) => apply(base, apply(r.frame[n], p));
    for (const b of rig.data.bones) {
      const a = pt(b.name);
      if (b.parent) { const p0 = pt(b.parent); ctx.globalAlpha = 0.45; ctx.beginPath(); ctx.moveTo(p0[0], p0[1]); ctx.lineTo(a[0], a[1]); ctx.stroke(); }
      ctx.globalAlpha = 1;
      if (b.tip) { const e = pt(b.name, [0, boneLength(b)]); ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(e[0], e[1]); ctx.stroke(); }
      ctx.beginPath(); ctx.arc(a[0], a[1], Math.max(3, 9 * k), 0, Math.PI * 2); ctx.fill();
    }
  }
}

function drawFrame(rig, index) {
  const ctx = frameCanvas.getContext('2d');
  const k = fit(frameCanvas, FRAME_VIEW);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = BG; ctx.fillRect(0, 0, frameCanvas.width, frameCanvas.height);
  const f = rig.frames[index];
  const b = baseFor(k, FRAME_VIEW, mirror);
  ctx.setTransform(b[0], b[3], b[1], b[4], b[2], b[5]);
  ctx.drawImage(rig.frameImgs[index], f.x, f.y);
}

// ---- Controls and the clock -----------------------------------------------------
const RIGS = { dr: 'rig_dr.json', ur: 'rig_ur.json', r1: 'rig.json' };
const loaded = {};
let current = 'dr', showBones = false, slow = false, mirror = false, thrustStart = null, clock = 0, last = null;
let swayState = {};
const $ = (id) => document.getElementById(id);
const buttons = { idle: $('idle'), thrust: $('thrust'), slow: $('slow'), bones: $('bones'), mirror: $('mirror') };
buttons.idle.onclick = () => { thrustStart = null; };
buttons.thrust.onclick = () => { thrustStart = clock; };
buttons.slow.onclick = () => { slow = !slow; };
buttons.bones.onclick = () => { showBones = !showBones; };
buttons.mirror.onclick = () => { mirror = !mirror; };
for (const key of Object.keys(RIGS)) $('v_' + key).onclick = () => choose(key);

function caption(rig) {
  const turned = Object.keys(rig.data.alts || {}).length;
  const strips = Object.keys(rig.data.sway || {}).length;
  $('rigCap').innerHTML = '<b>Skeleton</b><br>' + rig.data.bones.length + ' parts' +
    (turned ? ', ' + turned + ' turned pictures swapped in mid-thrust' : '') + (strips ? ', ' + strips + ' swaying strips' : '');
}
async function choose(key) {
  current = key;
  if (!loaded[key]) loaded[key] = await loadRig(RIGS[key]);
  swayState = {};
  caption(loaded[key]);
}

// The pose at time t (seconds since the page started), and which frame the
// frame-by-frame thrust shows then
function poseAt(rig, t) {
  let pose = idlePose(rig, t), frame = 0;
  if (thrustStart != null) {
    const u = t - thrustStart;
    if (u >= rig.length) thrustStart = null;
    else {
      pose = addPose(pose, keyedPose(rig.keys, u));
      for (let i = 0; i < rig.frameTimes.length; i++) if (u >= rig.frameTimes[i]) frame = i;
    }
  }
  return { pose, frame };
}
function step(rig, t, dt) {
  const { pose, frame } = poseAt(rig, t);
  swayStep(rig, swayState, pose, dt, t);
  return { pose: addPose(pose, swayPose(rig, swayState)), frame };
}

function tick(now) {
  const dt = last == null ? 0 : Math.min(0.05, (now - last) / 1000);
  last = now;
  const rig = loaded[current];
  if (rig) {
    const d = dt * (slow ? 0.25 : 1);
    clock += d;
    const { pose, frame } = step(rig, clock, Math.max(d, 1 / 240));
    drawRig(rig, pose);
    drawFrame(rig, frame);
  }
  for (const key of Object.keys(RIGS)) $('v_' + key).classList.toggle('on', key === current);
  buttons.idle.classList.toggle('on', thrustStart == null);
  buttons.thrust.classList.toggle('on', thrustStart != null);
  buttons.slow.classList.toggle('on', slow);
  buttons.bones.classList.toggle('on', showBones);
  buttons.mirror.classList.toggle('on', mirror);
  requestAnimationFrame(tick);
}

async function start() {
  const q = new URLSearchParams(location.search);
  await choose(q.get('rig') || 'dr');
  $('notes').innerHTML = await (await fetch('notes.html')).text();
  // ?rig=dr&t=0.42&thrust=1&bones=1&mirror=1 freezes a moment (for checking a pose)
  if (q.has('bones')) showBones = true;
  if (q.has('mirror')) mirror = true;
  if (q.has('t')) {
    const t = parseFloat(q.get('t'));
    const rig = loaded[current];
    if (q.has('thrust')) thrustStart = 0;
    let out = null;
    for (let s = 0; s <= t + 1e-9; s += 1 / 60) out = step(rig, s, 1 / 60); // run the swaying springs up to then
    drawRig(rig, out.pose);
    drawFrame(rig, out.frame);
    document.body.dataset.ready = '1';
    return;
  }
  document.body.dataset.ready = '1';
  requestAnimationFrame(tick);
}
start();
</script>
